<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="Arial, Helvetica, sans-serif">
  <title>hasGeometrySameControlPoints</title>
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="22" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">TRUE</text>
  <polygon points="30,190 30,60 150,60 150,190" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
  <polygon points="31,191 31,61 151,61 151,191" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="30" y="210" font-size="11" fill="#222" text-anchor="start">Stützpunkte identisch (≤ Tolerance)</text>
  <text x="300" y="22" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">FALSE</text>
  <polygon points="300,190 300,60 420,60 420,190" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
  <polygon points="300,190 300,60 360,60 420,60 420,190" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="360" cy="60" r="5" fill="#c0392b"/>
  <text x="372" y="52" font-size="11" fill="#c0392b" text-anchor="start">zusätzlicher Stützpunkt</text>
  <text x="300" y="210" font-size="11" fill="#222" text-anchor="start">gleiche Form, aber andere Stützpunkte</text>
</svg>
