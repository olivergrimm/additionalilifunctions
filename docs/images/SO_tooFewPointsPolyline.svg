<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" width="520" height="190" font-family="Arial, Helvetica, sans-serif">
  <title>tooFewPointsPolyline</title>
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="22" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">TRUE: zu wenig Punkte (&lt; 2)</text>
  <circle cx="100" cy="110" r="6" fill="#c0392b"/>
  <text x="115" y="114" font-size="12" fill="#222" text-anchor="start">Polyline mit 1 Punkt</text>
  <text x="300" y="22" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">FALSE: genügend Punkte (≥ 2)</text>
  <polyline points="300,130 400,80 480,120" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="300" cy="130" r="5" fill="#2e8b57"/>
  <circle cx="400" cy="80" r="5" fill="#2e8b57"/>
  <circle cx="480" cy="120" r="5" fill="#2e8b57"/>
</svg>
