  <circle cx="130" cy="80" r="18" fill="#cfe0f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="130" y="84" font-size="12" fill="#222" text-anchor="middle">B</text>
  <circle cx="210" cy="80" r="18" fill="#cfe0f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="210" y="84" font-size="12" fill="#222" text-anchor="middle">C</text>
  <line x1="68" y1="80" x2="112" y2="80" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="148" y1="80" x2="192" y2="80" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="20" y="130" font-size="11" fill="#222" text-anchor="start">Kette ohne Rückbezug</text>
  <text x="300" y="22" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">Ungültig (FALSE)</text>
  <circle cx="330" cy="80" r="18" fill="#f6d3cf" stroke="#c0392b" stroke-width="2"/>
  <text x="330" y="84" font-size="12" fill="#222" text-anchor="middle">A</text>
  <circle cx="410" cy="80" r="18" fill="#f6d3cf" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="84" font-size="12" fill="#222" text-anchor="middle">B</text>
