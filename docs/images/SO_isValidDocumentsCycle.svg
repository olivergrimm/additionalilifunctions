  <text x="340" y="130" font-size="11" fill="#c0392b" text-anchor="start">Endlosschleife A → B → A</text>
  <circle cx="530" cy="80" r="18" fill="#f6d3cf" stroke="#c0392b" stroke-width="2"/>
