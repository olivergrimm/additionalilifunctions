<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="Arial, Helvetica, sans-serif">
  <title>isValidDocumentsCycle</title>
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="22" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">Gültig (TRUE)</text>
  <circle cx="50" cy="80" r="18" fill="#cfe0f5" stroke="#1f5fa8" stroke-width="2"/>
