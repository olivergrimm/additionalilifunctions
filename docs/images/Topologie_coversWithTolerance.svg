  <rect width="100%" height="100%" fill="#ffffff"/>
  <polygon points="40,190 40,60 260,40 320,190" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
  <polyline points="40,60 260,40" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,3" stroke-linejoin="round"/>
  <polyline points="40,57 260,37 260,43 40,63" fill="#f6d3cf" opacity="0.5" stroke="none"/>
  <circle cx="40" cy="60" r="4" fill="#c0392b"/>
