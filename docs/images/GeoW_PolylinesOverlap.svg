<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="Arial, Helvetica, sans-serif">
  <title>PolylinesOverlap</title>
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="22" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">TRUE: gemeinsame Teilstrecke</text>
  <polyline points="30,90 150,90 210,40" fill="none" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="90,90 210,90 260,140" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,3" stroke-linejoin="round"/>
  <text x="95" y="112" font-size="11" fill="#777777" text-anchor="start">Überlappung</text>
  <line x1="92" y1="82" x2="148" y2="82" stroke="#2e8b57" stroke-width="6" opacity="0.4"/>
  <text x="300" y="22" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">FALSE: nur Kreuzung / Berührung</text>
  <polyline points="300,70 420,150" fill="none" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="300,150 420,70" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,3" stroke-linejoin="round"/>
  <circle cx="360" cy="110" r="4" fill="#444"/>
  <text x="372" y="106" font-size="11" fill="#777777" text-anchor="start">Schnittpunkt ≠ Überlappung</text>
  <text x="20" y="210" font-size="12" fill="#222" text-anchor="start">Geprüft wird, ob die Schnittmenge der Linien selbst wieder eine Linie ist.</text>
</svg>
